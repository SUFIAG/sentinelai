spring:
  application:
    name: sentinel-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: SentinelHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8081
  tomcat:
    max-threads: 200
    accept-count: 100
    connection-timeout: 5000

jwt:
  secret: SentinelAI-Super-Secret-Key-For-JWT-Token-Generation-2024-Must-Be-At-Least-256-Bits
  access-token-expiration: 3600
  refresh-token-expiration: 604800

# AI / LLM integration. With provider=none the platform uses deterministic
# rule-based reasoning. Set provider=openai and supply OPENAI_API_KEY to enable LLM.
ai:
  provider: ${AI_PROVIDER:none}
  model: ${AI_MODEL:gpt-4o-mini}
  timeout-seconds: 30
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
  retry:
    max-attempts: 3
    backoff-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.sentinel: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
