spring:
  datasource:
    url: jdbc:h2:mem:sentinel_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

jwt:
  secret: TestSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256Algorithm
  access-token-expiration: 3600
  refresh-token-expiration: 604800

logging:
  level:
    root: WARN
    com.sentinel: DEBUG
